<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcours des Boss — Elden Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="atmosphere" aria-hidden="true">
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="fog fog-a"></div>
  <div class="fog fog-b"></div>
  <div class="ember-field" id="emberField"></div>
</div>

<header class="site-header">
  <span class="site-eyebrow">Elden Ring</span>
  <h1 class="site-title">Parcours des Boss</h1>
  <div class="header-rule" aria-hidden="true"><span></span><i>&#10022;</i><span></span></div>
</header>

<main class="stage" id="stage">

  <section class="codex" id="codex" aria-live="polite">
    <div class="codex-frame">
      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>

      <!-- Structure mise à jour pour correspondre au screen -->
      <div class="codex-inner screen-accurate" id="codexInner">

        <div class="boss-topline" style="display: none;">
          <span class="chapter-tag" id="chapterTag">Chapitre I — Nécrolimbe</span>
          <span class="boss-number"><em>Boss</em> <b id="bossNumber">01</b><i>/50</i></span>
        </div>

        <h2 class="boss-name" id="bossName">&mdash;</h2>

        <div class="boss-portrait">
          <div class="portrait-frame">
            <img id="bossImage" src="images/bosses/placeholder.svg" alt="">
          </div>
        </div>

        <div class="boss-substats">
          <div class="substat substat-difficulty">
            <span class="substat-label" style="display: none;">Difficulté</span>
            <span class="stars" id="bossDifficulty" aria-label="Difficulté"></span>
          </div>
          <div class="substat">
            <span class="substat-label">ZONE:</span>
            <span class="substat-value" id="bossZone">&mdash;</span>
          </div>
        </div>

        <div class="screen-divider" aria-hidden="true"></div>

        <p class="boss-description" id="bossDescription">&nbsp;</p>

        <div class="screen-divider" aria-hidden="true"></div>

        <div class="stat-grid">
          <div class="stat-block">
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span class="stat-label">POINT DE VIE</span>
            <span class="stat-value" id="statHp">&mdash;</span>
          </div>
          <div class="stat-block">
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
            <span class="stat-label">DÉFENSE</span>
            <span class="stat-value" id="statDef">&mdash;</span>
          </div>
          <div class="stat-block">
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
            <span class="stat-label">POINT FAIBLE</span>
            <span class="stat-value" id="statWeak">&mdash;</span>
          </div>
        </div>

        <div class="stat-line" style="display: none;">
          <span><span class="stat-line-label">Résistances</span><span id="statResist">&mdash;</span></span>
          <span><span class="stat-line-label">Récompenses</span><span id="statRewards">&mdash;</span></span>
        </div>

        <div class="bottom-ornament"></div>
      </div>
    </div>

    <nav class="boss-nav" aria-label="Navigation entre les boss">
      <button type="button" class="nav-btn nav-prev" id="prevBtn">
        <span class="nav-arrow">&larr;</span><span class="nav-label">Boss précédent</span>
      </button>

      <div class="progress-wrap">
        <span class="progress-text" id="progressText">BOSS 01 / 50</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <button type="button" class="nav-btn nav-next" id="nextBtn">
        <span class="nav-label">Boss suivant</span><span class="nav-arrow">&rarr;</span>
      </button>
    </nav>
  </section>

</main>

<a class="admin-link" href="admin/index.html">Administration</a>

<div class="chapter-veil" id="chapterVeil" aria-hidden="true">
  <div class="chapter-veil-inner">
    <span class="cv-eyebrow" id="cvEyebrow">Chapitre II</span>
    <h2 class="cv-title" id="cvTitle">Liurnia</h2>
    <span class="cv-sub" id="cvSub">Des Lacs</span>
    <div class="cv-rule"><span></span><i>&#10022;</i><span></span></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
